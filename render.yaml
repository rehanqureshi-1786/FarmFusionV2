services:
  - type: web
    name: farmfusion-backend
    env: python
    plan: free
    region: oregon
    branch: master
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: FIREBASE_CREDENTIALS_JSON
        fromSecret: FIREBASE_CREDENTIALS_JSON
      - key: FIREBASE_CREDENTIALS_PATH
        value: "/etc/secrets/FIREBASE_CREDENTIALS_JSON"
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
